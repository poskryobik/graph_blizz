services:
  neo4j:
    image: neo4j:2025.07.1-community
    environment:
      NEO4J_AUTH: neo4j/${GRAPH_BLIZZ_NEO4J__PASSWORD:-graph-blizz-demo-password}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u "$${NEO4J_AUTH%%/*}" -p "$${NEO4J_AUTH#*/}"
          "RETURN 1"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - neo4j_data:/data
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.15.4
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS=" " read -r _ status _ <&3;
          test "$$status" = 200'
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - "${GRAPH_BLIZZ_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
      - host_access

  rag-worker:
    build:
      context: .
    command: ["/app/.venv/bin/python", "-m", "backend.worker"]
    stop_grace_period: 2m
    depends_on:
      minio: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    environment:
      GRAPH_BLIZZ_ENVIRONMENT: development
      GRAPH_BLIZZ_AUTH__MODE: ${GRAPH_BLIZZ_AUTH__MODE:-demo_owner}
      GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID: ${GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID:-demo-owner}
      GRAPH_BLIZZ_POSTGRES__HOST: postgres
      GRAPH_BLIZZ_POSTGRES__DATABASE: graph_blizz
      GRAPH_BLIZZ_POSTGRES__USERNAME: graph_blizz
      GRAPH_BLIZZ_POSTGRES__PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_POSTGRES__SSL_MODE: disable
      GRAPH_BLIZZ_MINIO__ENDPOINT_URL: http://minio:9000
      GRAPH_BLIZZ_MINIO__ACCESS_KEY: ${GRAPH_BLIZZ_MINIO__ACCESS_KEY:-graph-blizz-demo}
      GRAPH_BLIZZ_MINIO__SECRET_KEY: ${GRAPH_BLIZZ_MINIO__SECRET_KEY:-graph-blizz-demo-password}
      GRAPH_BLIZZ_NEO4J__URI: bolt://neo4j:7687
      GRAPH_BLIZZ_NEO4J__PASSWORD: ${GRAPH_BLIZZ_NEO4J__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_QDRANT__URL: http://qdrant:6333
      GRAPH_BLIZZ_EMBEDDING__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL:-http://vllm-embeddings:8000/v1}
      GRAPH_BLIZZ_EMBEDDING__DIMENSION: ${GRAPH_BLIZZ_EMBEDDING__DIMENSION:-1024}
      GRAPH_BLIZZ_EXTERNAL_LLM__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EXTERNAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GRAPH_BLIZZ_WORKER__POLL_SECONDS: ${GRAPH_BLIZZ_WORKER__POLL_SECONDS:-1}
      GRAPH_BLIZZ_WORKER__LEASE_SECONDS: ${GRAPH_BLIZZ_WORKER__LEASE_SECONDS:-60}
      GRAPH_BLIZZ_WORKER__HEARTBEAT_SECONDS: ${GRAPH_BLIZZ_WORKER__HEARTBEAT_SECONDS:-15}
      GRAPH_BLIZZ_WORKER__RETRY_SECONDS: ${GRAPH_BLIZZ_WORKER__RETRY_SECONDS:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - host_access

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GRAPH_BLIZZ_MINIO__ACCESS_KEY:-graph-blizz-demo}
      MINIO_ROOT_PASSWORD: ${GRAPH_BLIZZ_MINIO__SECRET_KEY:-graph-blizz-demo-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - "${GRAPH_BLIZZ_MINIO_API_PORT:-9000}:9000"
      - "${GRAPH_BLIZZ_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
      - host_access

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graph_blizz
      POSTGRES_USER: graph_blizz
      POSTGRES_PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  vllm-embeddings:
    profiles: ["gpu"]
    image: vllm/vllm-openai:v0.10.2
    command:
      - --model
      - ai-sage/Giga-Embeddings-instruct-480M-0826
      - --task
      - embed
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --trust-remote-code
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${GRAPH_BLIZZ_EMBEDDING_PORT:-8001}:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - backend
      - host_access

  rag-api:
    build:
      context: .
    depends_on:
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      GRAPH_BLIZZ_ENVIRONMENT: development
      GRAPH_BLIZZ_AUTH__MODE: ${GRAPH_BLIZZ_AUTH__MODE:-demo_owner}
      GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID: ${GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID:-demo-owner}
      GRAPH_BLIZZ_POSTGRES__HOST: postgres
      GRAPH_BLIZZ_POSTGRES__PORT: "5432"
      GRAPH_BLIZZ_POSTGRES__DATABASE: graph_blizz
      GRAPH_BLIZZ_POSTGRES__USERNAME: graph_blizz
      GRAPH_BLIZZ_POSTGRES__PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_POSTGRES__SSL_MODE: disable
      GRAPH_BLIZZ_MINIO__ENDPOINT_URL: http://minio:9000
      GRAPH_BLIZZ_MINIO__BUCKET: graph-blizz
      GRAPH_BLIZZ_MINIO__ACCESS_KEY: ${GRAPH_BLIZZ_MINIO__ACCESS_KEY:-graph-blizz-demo}
      GRAPH_BLIZZ_MINIO__SECRET_KEY: ${GRAPH_BLIZZ_MINIO__SECRET_KEY:-graph-blizz-demo-password}
      GRAPH_BLIZZ_NEO4J__URI: bolt://neo4j:7687
      GRAPH_BLIZZ_NEO4J__USERNAME: neo4j
      GRAPH_BLIZZ_NEO4J__PASSWORD: ${GRAPH_BLIZZ_NEO4J__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_QDRANT__URL: http://qdrant:6333
      GRAPH_BLIZZ_EMBEDDING__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL:-http://vllm-embeddings:8000/v1}
      GRAPH_BLIZZ_EMBEDDING__MODEL: ai-sage/Giga-Embeddings-instruct-480M-0826
      GRAPH_BLIZZ_EMBEDDING__API_KEY:
      GRAPH_BLIZZ_EMBEDDING__DIMENSION: ${GRAPH_BLIZZ_EMBEDDING__DIMENSION:-1024}
      GRAPH_BLIZZ_EXTERNAL_LLM__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EXTERNAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      GRAPH_BLIZZ_EXTERNAL_LLM__MODEL: ${GRAPH_BLIZZ_EXTERNAL_LLM__MODEL:-qwen3:1.7b}
      GRAPH_BLIZZ_EXTERNAL_LLM__API_KEY:
      GRAPH_BLIZZ_EXTERNAL_LLM__TIMEOUT_SECONDS: ${GRAPH_BLIZZ_EXTERNAL_LLM__TIMEOUT_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GRAPH_BLIZZ_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    networks:
      - backend
      - host_access

volumes:
  huggingface_cache:
  minio_data:
  neo4j_data:
  postgres_data:
  qdrant_data:

networks:
  backend:
    internal: true
  host_access:
