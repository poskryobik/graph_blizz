services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graph_blizz
      POSTGRES_USER: graph_blizz
      POSTGRES_PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rag-api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GRAPH_BLIZZ_ENVIRONMENT: development
      GRAPH_BLIZZ_POSTGRES__HOST: postgres
      GRAPH_BLIZZ_POSTGRES__PORT: "5432"
      GRAPH_BLIZZ_POSTGRES__DATABASE: graph_blizz
      GRAPH_BLIZZ_POSTGRES__USERNAME: graph_blizz
      GRAPH_BLIZZ_POSTGRES__PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_POSTGRES__SSL_MODE: disable
    ports:
      - "${GRAPH_BLIZZ_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    internal: true
