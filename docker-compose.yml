services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GRAPH_BLIZZ_MINIO__ACCESS_KEY:-graph-blizz-demo}
      MINIO_ROOT_PASSWORD: ${GRAPH_BLIZZ_MINIO__SECRET_KEY:-graph-blizz-demo-password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - "${GRAPH_BLIZZ_MINIO_API_PORT:-9000}:9000"
      - "${GRAPH_BLIZZ_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
      - host_access

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graph_blizz
      POSTGRES_USER: graph_blizz
      POSTGRES_PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rag-api:
    build:
      context: .
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      GRAPH_BLIZZ_ENVIRONMENT: development
      GRAPH_BLIZZ_AUTH__MODE: ${GRAPH_BLIZZ_AUTH__MODE:-demo_owner}
      GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID: ${GRAPH_BLIZZ_AUTH__DEMO_OWNER_ID:-demo-owner}
      GRAPH_BLIZZ_POSTGRES__HOST: postgres
      GRAPH_BLIZZ_POSTGRES__PORT: "5432"
      GRAPH_BLIZZ_POSTGRES__DATABASE: graph_blizz
      GRAPH_BLIZZ_POSTGRES__USERNAME: graph_blizz
      GRAPH_BLIZZ_POSTGRES__PASSWORD: ${GRAPH_BLIZZ_POSTGRES__PASSWORD:-graph-blizz-demo-password}
      GRAPH_BLIZZ_POSTGRES__SSL_MODE: disable
      GRAPH_BLIZZ_MINIO__ENDPOINT_URL: http://minio:9000
      GRAPH_BLIZZ_MINIO__BUCKET: graph-blizz
      GRAPH_BLIZZ_MINIO__ACCESS_KEY: ${GRAPH_BLIZZ_MINIO__ACCESS_KEY:-graph-blizz-demo}
      GRAPH_BLIZZ_MINIO__SECRET_KEY: ${GRAPH_BLIZZ_MINIO__SECRET_KEY:-graph-blizz-demo-password}
    ports:
      - "${GRAPH_BLIZZ_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    networks:
      - backend
      - host_access

volumes:
  minio_data:
  postgres_data:

networks:
  backend:
    internal: true
  host_access:
