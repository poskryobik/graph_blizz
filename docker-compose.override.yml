services:
  rag-api:
    environment:
      GRAPH_BLIZZ_EMBEDDING__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL:?set GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL}
      GRAPH_BLIZZ_EMBEDDING__MODEL: ${GRAPH_BLIZZ_EMBEDDING__MODEL:?set GRAPH_BLIZZ_EMBEDDING__MODEL}
      GRAPH_BLIZZ_EMBEDDING__API_KEY: ${GRAPH_BLIZZ_EMBEDDING__API_KEY:?set GRAPH_BLIZZ_EMBEDDING__API_KEY}
      GRAPH_BLIZZ_EMBEDDING__DIMENSION: ${GRAPH_BLIZZ_EMBEDDING__DIMENSION:?set GRAPH_BLIZZ_EMBEDDING__DIMENSION}
      GRAPH_BLIZZ_EMBEDDING__TIMEOUT_SECONDS: ${GRAPH_BLIZZ_EMBEDDING__TIMEOUT_SECONDS:-60}

  rag-worker:
    environment:
      GRAPH_BLIZZ_EMBEDDING__BASE_URL: ${GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL:?set GRAPH_BLIZZ_COMPOSE_EMBEDDING_BASE_URL}
      GRAPH_BLIZZ_EMBEDDING__MODEL: ${GRAPH_BLIZZ_EMBEDDING__MODEL:?set GRAPH_BLIZZ_EMBEDDING__MODEL}
      GRAPH_BLIZZ_EMBEDDING__API_KEY: ${GRAPH_BLIZZ_EMBEDDING__API_KEY:?set GRAPH_BLIZZ_EMBEDDING__API_KEY}
      GRAPH_BLIZZ_EMBEDDING__DIMENSION: ${GRAPH_BLIZZ_EMBEDDING__DIMENSION:?set GRAPH_BLIZZ_EMBEDDING__DIMENSION}
      GRAPH_BLIZZ_EMBEDDING__TIMEOUT_SECONDS: ${GRAPH_BLIZZ_EMBEDDING__TIMEOUT_SECONDS:-60}